name: Deploy iOS Install Hub to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "ios-installer/**"
      - ".github/workflows/deploy-ios-installer.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ios-installer-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ios-installer
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
